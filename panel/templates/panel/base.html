<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}Panel de Gestión{% endblock %} - Escuela</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .contenedor { max-width: 1100px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header-panel { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
        .btn-volver { background: #718096; color: white; text-decoration: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; }
        .btn-accion { padding: 10px 18px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-block; font-weight: bold; }
        .btn-verde { background: #2f855a; color: white; }
        .btn-azul { background: #3182ce; color: white; }
        .btn-rojo { background: #c53030; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #cbd5e0; padding: 12px; text-align: left; }
        th { background: #edf2f7; color: #1a365d; }
        .form-grupo { margin-bottom: 20px; }
        .form-grupo label { display: block; font-weight: bold; margin-bottom: 5px; color: #2d3748; }
        .form-grupo input, .form-grupo textarea, .form-grupo select { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="contenedor">
        <div class="header-panel">
            <h2 style="margin: 0; color: #1a365d;">Panel de Gestión Escolar</h2>

            <div style="display: flex; gap: 10px;">
                {% if request.resolver_match.url_name == 'panel_inicio' %}
                    <!-- Si estás en el menú principal del panel, te lleva a la raíz del sitio web -->
                    <a href="/" class="btn-volver">← Ir al Sitio Web</a>
                {% else %}
                    <!-- Si estás dentro de cualquier módulo (Noticias, Requisitos, etc.) -->
                    <a href="javascript:history.back()" class="btn-volver" style="background: #a0aec0;">← Atrás</a>
                    <a href="{% url 'panel_inicio' %}" class="btn-volver">📋 Menú Panel</a>
                    <a href="/" class="btn-volver" style="background: #2b6cb0;">🏠 Sitio Web</a>
                {% endif %}
            </div>
        </div>

        {% block contenido %}{% endblock %}
    </div>

</body>
</html>
