{% extends 'panel/base.html' %}

{% block titulo %}Confirmar Eliminación{% endblock %}

{% block contenido %}
    <style>
        .confirm-card {
            max-width: 550px;
            margin: 2rem auto;
            text-align: center;
            padding: 2.5rem 1.5rem;
            background: #ffffff;
            border-radius: 16px;
        }

        .alert-icon-box {
            width: 70px;
            height: 70px;
            background-color: #fef2f2;
            color: #dc2626;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin: 0 auto 1.5rem;
            border: 2px solid #fee2e2;
        }

        .confirm-title {
            color: #0f172a;
            font-weight: 800;
            font-size: 1.35rem;
            margin-bottom: 0.8rem;
            letter-spacing: -0.3px;
        }

        .confirm-object {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 1rem 1.2rem;
            border-radius: 12px;
            color: var(--primary-navy);
            font-weight: 700;
            font-size: 0.98rem;
            margin: 1.2rem 0;
            line-height: 1.4;
            word-break: break-word;
        }

        .confirm-warning {
            color: #64748b;
            font-size: 0.88rem;
            font-weight: 500;
            margin-bottom: 2rem;
        }

        .confirm-actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn-confirm-delete {
            background-color: #c53030;
            color: #ffffff !important;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 12px rgba(197, 48, 48, 0.25);
            transition: all 0.2s ease;
        }

        .btn-confirm-delete:hover {
            background-color: #9b2c2c;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(197, 48, 48, 0.4);
        }

        .btn-confirm-cancel {
            background-color: #64748b;
            color: #ffffff !important;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .btn-confirm-cancel:hover {
            background-color: #475569;
            transform: translateY(-1px);
        }
    </style>

    <div class="confirm-card">
        <div class="alert-icon-box">
            <i class="bi bi-exclamation-triangle-fill"></i>
        </div>

        <h3 class="confirm-title">¿Estás seguro de que querés eliminar este registro?</h3>

        <div class="confirm-object">
            "{{ object }}"
        </div>

        <p class="confirm-warning">
            <i class="bi bi-info-circle me-1"></i> Esta acción no se puede deshacer.
        </p>

        <form method="POST" class="confirm-actions">
            {% csrf_token %}
            <a href="javascript:history.back()" class="btn-confirm-cancel">
                <i class="bi bi-x-lg"></i> Cancelar
            </a>
            <button type="submit" class="btn-confirm-delete">
                <i class="bi bi-trash-fill"></i> Sí, Eliminar
            </button>
        </form>
    </div>
{% endblock %}
