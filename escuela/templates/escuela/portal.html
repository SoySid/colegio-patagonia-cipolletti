{% extends 'escuela/base.html' %}

{% block title %}Portal Alumnos - {{ escuela_info.nombre|default:"Colegio Patagonia" }}{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 4rem auto; padding: 0 1rem;">
    <div style="background: white; padding: 2.5rem; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.06); text-align: center;">
        <h2 style="font-size: 1.6rem; color: var(--primary); margin-bottom: 0.5rem;">Portal de Autogestión</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem;">Acceso para docentes y alumnos o tutores</p>

        <form style="display: flex; flex-direction: column; gap: 1.2rem; text-align: left;">
            <div>
                <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.3rem; color: var(--text-dark);">DNI</label>
                <input type="text" placeholder="Ingrese su DNI" style="width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px;">
            </div>
            <div>
                <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.3rem; color: var(--text-dark);">Contraseña</label>
                <input type="password" placeholder="••••••••" style="width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px;">
            </div>
            <button type="button" style="background: var(--primary); color: white; padding: 0.85rem; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; margin-top: 0.5rem;">Ingresar al Sistema</button>
        </form>

        <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #f1f5f9;">
            <a href="#" style="color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 600;">¿Olvidaste tu contraseña o usuario?</a>
        </div>
    </div>
</div>
{% endblock %}
