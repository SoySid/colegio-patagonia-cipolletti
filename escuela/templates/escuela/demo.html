<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Visor Hero Rotativo - Colegio Patagonia</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        titulo: ['Cinzel', 'serif']
                    }
                }
            }
        }
    </script>

    <style>
        [x-cloak] { display: none !important; }
        body { background-color: #090d16; color: #f8fafc; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="p-4 sm:p-8 md:p-12 min-h-screen flex items-center justify-center">

    <section x-data="{ 
                openLightbox: false, 
                currentIndex: 0,
                timer: null,
                fotos: [
                    'https://images.unsplash.com/photo-1580582932707-520aed937b7b?q=80&w=1200&auto=format&fit=crop',
                    'https://images.unsplash.com/photo-1509062522246-3755977927d7?q=80&w=1200&auto=format&fit=crop',
                    'https://images.unsplash.com/photo-1523240795612-9a054b0db644?q=80&w=1200&auto=format&fit=crop',
                    'https://images.unsplash.com/photo-1577896851231-70ef18881754?q=80&w=1200&auto=format&fit=crop',
                    'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1200&auto=format&fit=crop'
                ],
                startTimer() {
                    if (this.openLightbox) return;
                    this.stopTimer();
                    this.timer = setInterval(() => {
                        this.next();
                    }, 2500);
                },
                stopTimer() {
                    if (this.timer) clearInterval(this.timer);
                },
                openModal() {
                    this.stopTimer();
                    this.openLightbox = true;
                },
                closeModal() {
                    this.openLightbox = false;
                    this.startTimer();
                },
                next() { 
                    this.currentIndex = (this.currentIndex + 1) % this.fotos.length; 
                },
                prev() { 
                    this.currentIndex = (this.currentIndex - 1 + this.fotos.length) % this.fotos.length; 
                },
                init() {
                    this.startTimer();
                }
             }" 
             class="w-full max-w-5xl mx-auto bg-slate-900/40 border border-slate-800/80 rounded-3xl p-6 sm:p-10 backdrop-blur-xl shadow-2xl">
        
        <!-- Header de la Galería -->
        <div class="mb-6 flex items-center justify-between border-b border-slate-800/80 pb-5">
            <div>
                <span class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full text-xs font-bold bg-emerald-500/10 border border-emerald-500/30 text-[#34d399] mb-2 shadow-[0_0_10px_rgba(52,211,153,0.15)]">
                    <span class="w-1.5 h-1.5 rounded-full bg-[#34d399] animate-pulse"></span>
                    INSTALACIONES Y ACTIVIDADES
                </span>
                <h2 class="font-titulo text-2xl sm:text-4xl font-extrabold text-white tracking-tight">Galería de la Escuela</h2>
            </div>
        </div>

        <!-- VISOR PRINCIPAL HERO EN HOME -->
        <div @mouseenter="stopTimer()" 
             @mouseleave="startTimer()"
             class="group relative h-[380px] sm:h-[480px] w-full rounded-2xl overflow-hidden border border-slate-800/90 shadow-2xl hover:border-emerald-500/40 transition-colors duration-500">
            
            <!-- Fotos con rotación fluida en Home -->
            <template x-for="(url, index) in fotos" :key="index">
                <img x-show="currentIndex === index"
                     x-transition:enter="transition ease-out duration-500"
                     x-transition:enter-start="opacity-0 scale-105"
                     x-transition:enter-end="opacity-100 scale-100"
                     x-transition:leave="transition ease-in duration-300 absolute inset-0"
                     x-transition:leave-start="opacity-100"
                     x-transition:leave-end="opacity-0"
                     :src="url" 
                     @click="openModal()"
                     class="w-full h-full object-cover cursor-pointer" 
                     loading="lazy" />
            </template>

            <!-- Botones Flechas Home -->
            <button @click="prev()" 
                    class="opacity-0 group-hover:opacity-100 transition-all duration-300 absolute left-4 top-1/2 -translate-y-1/2 w-11 h-11 rounded-2xl bg-slate-950/70 border border-slate-800 text-white hover:text-[#34d399] hover:border-[#34d399] hover:shadow-[0_0_15px_rgba(52,211,153,0.3)] flex items-center justify-center backdrop-blur-md focus:outline-none">
                <i class="bi bi-chevron-left text-lg"></i>
            </button>

            <button @click="next()" 
                    class="opacity-0 group-hover:opacity-100 transition-all duration-300 absolute right-4 top-1/2 -translate-y-1/2 w-11 h-11 rounded-2xl bg-slate-950/70 border border-slate-800 text-white hover:text-[#34d399] hover:border-[#34d399] hover:shadow-[0_0_15px_rgba(52,211,153,0.3)] flex items-center justify-center backdrop-blur-md focus:outline-none">
                <i class="bi bi-chevron-right text-lg"></i>
            </button>

            <!-- Indicadores Píldora -->
            <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex items-center gap-2 bg-slate-950/80 px-4 py-2 rounded-full border border-slate-800/80 backdrop-blur-md shadow-lg">
                <template x-for="(url, index) in fotos" :key="index">
                    <button @click="currentIndex = index" 
                            :class="currentIndex === index ? 'bg-[#34d399] w-7 shadow-[0_0_10px_rgba(52,211,153,0.5)]' : 'bg-slate-700 w-2 hover:bg-slate-500'" 
                            class="h-2 rounded-full transition-all duration-300 focus:outline-none"></button>
                </template>
            </div>
        </div>

        <!-- LIGHTBOX EN PANTALLA COMPLETA (SIN PARPADEO) -->
        <template x-teleport="body">
            <div x-show="openLightbox" 
                 x-cloak 
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0 backdrop-blur-none"
                 x-transition:enter-end="opacity-100 backdrop-blur-md"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="opacity-100 backdrop-blur-md"
                 x-transition:leave-end="opacity-0 backdrop-blur-none"
                 @keydown.window.escape="closeModal()"
                 @keydown.window.arrow-right="next()"
                 @keydown.window.arrow-left="prev()"
                 class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/95 backdrop-blur-md">
                
                <div @click.away="closeModal()" 
                     x-transition:enter="transition ease-out duration-300 transform"
                     x-transition:enter-start="opacity-0 scale-90"
                     x-transition:enter-end="opacity-100 scale-100"
                     x-transition:leave="transition ease-in duration-200 transform"
                     x-transition:leave-start="opacity-100 scale-100"
                     x-transition:leave-end="opacity-0 scale-90"
                     class="relative max-w-5xl w-full flex items-center justify-center">
                    
                    <!-- Botón Cerrar -->
                    <button @click="closeModal()" class="absolute -top-12 right-0 text-slate-400 hover:text-white text-3xl font-bold transition-colors focus:outline-none">✕</button>
                    
                    <!-- Imagen Única Directa (Sin animaciones internas que causen flicker) -->
                    <img :src="fotos[currentIndex]" 
                         class="max-h-[85vh] w-auto object-contain rounded-2xl border border-slate-800 shadow-[0_0_50px_rgba(0,0,0,0.9)] select-none" />

                    <!-- Flecha Izquierda Modal -->
                    <button @click="prev()" class="absolute left-3 sm:left-6 w-12 h-12 rounded-2xl bg-slate-900/80 border border-slate-700 text-white hover:text-[#34d399] hover:border-[#34d399] hover:scale-110 flex items-center justify-center transition-all backdrop-blur-md shadow-2xl focus:outline-none">
                        <i class="bi bi-chevron-left text-xl"></i>
                    </button>

                    <!-- Flecha Derecha Modal -->
                    <button @click="next()" class="absolute right-3 sm:right-6 w-12 h-12 rounded-2xl bg-slate-900/80 border border-slate-700 text-white hover:text-[#34d399] hover:border-[#34d399] hover:scale-110 flex items-center justify-center transition-all backdrop-blur-md shadow-2xl focus:outline-none">
                        <i class="bi bi-chevron-right text-xl"></i>
                    </button>
                </div>
            </div>
        </template>

    </section>

</body>
</html>
